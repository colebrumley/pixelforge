name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64: with ubuntu (x86-64) it backs the cross-platform golden
        # check (the same tests/golden.json on both).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features -- --include-ignored
      - run: cargo xtask golden --check
      - run: cargo xtask fixtures --check
      - run: cargo build --release -p pixelforge
      - name: smoke convert
        run: |
          target/release/pixelforge convert tests/fixtures/circle_alpha.png --preset sprite -o "$RUNNER_TEMP/smoke"
          test -s "$RUNNER_TEMP/smoke/circle_alpha.png"
          test -s "$RUNNER_TEMP/smoke/circle_alpha_meta.json"

  # The optional Python binding (crates/pixelforge-py); the only job with Python.
  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # The CLI, for the smoke tests' comparison with `pixelforge convert`.
      - run: cargo build --release -p pixelforge
      - run: uv venv "$RUNNER_TEMP/venv"
      - run: uv pip install --python "$RUNNER_TEMP/venv/bin/python" ./crates/pixelforge-py pytest
      - run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q crates/pixelforge-py/tests'
