[package]
name = "pixelforge-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python binding of the pixelforge library (extension module pixelforge._native)"
publish = false

[lib]
name = "pixelforge_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
numpy = "0.29.0"
pixelforge = { path = "../pixelforge" }
