[package]
name = "pixelforge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic conversion of raster images into 16-bit-style pixel art (library)"
publish = false

[dependencies]
# Pure-Rust exp: bit-identical on every platform, unlike f64::exp (platform libm).
libm = "0.2.16"

[dev-dependencies]
# Reads the oracle fixtures in tests/oracle (tests only).
serde_json = "1.0.150"
