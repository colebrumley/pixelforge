[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pixelforge"
# Keep equal to pixelforge/version.py and rust/Cargo.toml (tests/test_version.py checks).
version = "0.1.0"
description = "Deterministic conversion of raster images into 16-bit-style pixel art"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Cole Brumley"}]
keywords = ["pixel-art", "image-processing", "downscaling", "palette", "sprites", "tileset"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "click>=8.1",
]

[project.optional-dependencies]
bg = ["rembg>=2.0", "onnxruntime>=1.16"]
[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/colebrumley/pixelforge"
Repository = "https://github.com/colebrumley/pixelforge"

[project.scripts]
pixelforge = "pixelforge.cli:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "."
module-name = "pixelforge._native"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension on `uv sync` / `uv run` when the Rust sources change.
cache-keys = [{file = "pyproject.toml"}, {file = "rust/Cargo.toml"}, {file = "rust/Cargo.lock"}, {file = "rust/src/**/*.rs"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: kopf at full fixture size (deselect with -m \"not slow\"; CI runs everything)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Reference prototypes under docs/ are not package code.
extend-exclude = ["docs/prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Each ignore below matches 1-3 existing violations (10 in total when this config was added).
# TODO: fix the code and drop these one at a time to tighten the gate.
ignore = [
    "E501",   # line-too-long: 3 lines at 101-102 columns
    "B905",   # zip() without strict=: 3 call sites
    "B023",   # closure over loop variables in gerstner.py (correct today, fragile)
    "UP037",  # quoted annotation in config.py
    "I001",   # unsorted imports in tests/test_preprocess.py
]

[tool.ruff.lint.isort]
known-first-party = ["pixelforge"]
