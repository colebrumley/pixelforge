[package]
name = "pixelforge_native"
version = "0.1.0"
edition = "2021"
description = "Native hot loops for pixelforge (Python extension module pixelforge._native)"
license = "MIT"
publish = false

[lib]
name = "pixelforge_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
numpy = "0.29.0"

# Determinism: no fast-math and no target-cpu=native, here or in any .cargo/config.toml.
# Results must not depend on the machine that compiled them.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
